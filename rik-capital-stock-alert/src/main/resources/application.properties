server.port=8080

# RIK Capital listed-company database
stock-alert.excel-file=classpath:data/SE_Listed_Companies - FY27 - Rik_Capital.xlsx
stock-alert.sheet-name=Q2_Potential_Client
stock-alert.header-row=2

# Gmail SMTP
# Use your Gmail address here and a Gmail App Password (not your normal password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email recipient
stock-alert.admin-email=${STOCK_ALERT_ADMIN_EMAIL}
